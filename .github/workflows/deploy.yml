name: Deploy to GitHub Pages
# Builds ONLY from committed files (no data download, no build:data / build:bridge): `build:offline`
# runs the build with outbound network access blocked, so a step that reaches for the network fails.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reusable: the scheduled auto-update workflow calls this after committing with GITHUB_TOKEN
  # (pushes made with GITHUB_TOKEN do not trigger the `push` event above).
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to deploy (defaults to the triggering ref)
        type: string
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Committed generated files are complete and up to date (offline)
        run: npm run check:generated
      - name: Vendored NCP files match the checksums in UPSTREAM.md
        run: npm run check:vendor
      - name: Site URL (canonical / Open Graph / sitemap)
        id: site
        # Optional repository variable SITE_URL (custom domain or fork). Unset/empty: derived
        # https://<owner, lowercased>.github.io/<repo>/ (Pages hostnames are lowercase).
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="${SITE_URL#"${SITE_URL%%[![:space:]]*}"}"; url="${url%"${url##*[![:space:]]}"}"
          if [ -z "$url" ]; then
            owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            url="https://${owner}.github.io/${REPO:-${GITHUB_REPOSITORY#*/}}/"
          fi
          echo "VITE_SITE_URL=$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Build (network blocked)
        run: npm run build:offline
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: ${{ steps.site.outputs.url }}
          # Optional repository variable (Settings > Secrets and variables > Actions > Variables).
          # Unset/empty: the build has no usage statistics at all. Validated by vite.config.ts.
          VITE_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
