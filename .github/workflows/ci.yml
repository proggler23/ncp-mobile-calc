name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm test
      # generated data present + schema-valid, bridge maps identical to an offline rebuild,
      # NCP patches (if any) applied to the vendored files
      - run: npm run check:generated
      - run: npm run ncp:patches
      # proves the production build needs no network (same command the deploy workflow uses)
      - run: npm run build:offline
