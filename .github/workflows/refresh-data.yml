# Weekly data refresh: rebuilds src/data/generated/ from @pkmn/dex, the pokemon-showdown npm
# package, PokeAPI CSVs (German names) and Smogon usage stats, then opens a PR if anything changed.
name: Refresh data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # data + bridge name maps (the CI checkout has no download cache, so this always refetches)
      - run: npm run build:assets
      - run: npm run typecheck && npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-data
          delete-branch: true
          add-paths: |
            src/data/generated
            src/bridge/generated
          commit-message: 'chore(data): refresh generated game data'
          title: 'chore(data): refresh generated game data'
          body: |
            Automated weekly refresh of `src/data/generated/` and `src/bridge/generated/` via `npm run build:assets`.
            Sources and versions are recorded in `src/data/generated/sources.json`.
          labels: data
