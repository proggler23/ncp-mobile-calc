# Placeholder: weekly data refresh. Will open a PR with updated generated data in a later phase.
name: Refresh data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:data
